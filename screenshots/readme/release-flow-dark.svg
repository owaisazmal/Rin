<svg xmlns="http://www.w3.org/2000/svg" width="680" height="728" viewBox="0 0 680 728" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Release: from app.json to the stores</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#B4B2A9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="190" y="40" width="300" height="56" rx="8" fill="#3C3489" stroke="#AFA9EC" stroke-width="0.75"/><text x="340.0" y="59" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#CECBF6">Raise the build numbers</text><text x="340.0" y="78" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#AFA9EC">In app.json, plus version if public</text><line x1="340" y1="96" x2="340" y2="132" stroke="#B4B2A9" stroke-width="1.5" marker-end="url(#a)"/><rect x="190" y="136" width="300" height="56" rx="8" fill="#3C3489" stroke="#AFA9EC" stroke-width="0.75"/><text x="340.0" y="155" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#CECBF6">Commit and push</text><text x="340.0" y="174" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#AFA9EC">Wait for CI to go green</text><line x1="340" y1="192" x2="340" y2="228" stroke="#B4B2A9" stroke-width="1.5" marker-end="url(#a)"/><rect x="190" y="232" width="300" height="56" rx="8" fill="#3C3489" stroke="#AFA9EC" stroke-width="0.75"/><text x="340.0" y="251" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#CECBF6">Start the release</text><text x="340.0" y="270" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#AFA9EC">Run workflow, or push a version tag</text><line x1="340" y1="288" x2="340" y2="324" stroke="#B4B2A9" stroke-width="1.5" marker-end="url(#a)"/><rect x="190" y="328" width="300" height="56" rx="8" fill="#085041" stroke="#5DCAA5" stroke-width="0.75"/><text x="340.0" y="347" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#9FE1CB">Release run on GitHub</text><text x="340.0" y="366" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5DCAA5">Checks, CI, queues builds, ~12 min</text><line x1="340" y1="384" x2="340" y2="420" stroke="#B4B2A9" stroke-width="1.5" marker-end="url(#a)"/><rect x="190" y="424" width="300" height="56" rx="8" fill="#712B13" stroke="#F0997B" stroke-width="0.75"/><text x="340.0" y="443" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#F5C4B3">EAS builds the apps</text><text x="340.0" y="462" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#F0997B">iOS and Android, 15 to 30 min</text><path d="M340 480 L340 500 L190 500 L190 516" fill="none" stroke="#B4B2A9" stroke-width="1.5" marker-end="url(#a)"/><path d="M340 500 L490 500 L490 516" fill="none" stroke="#B4B2A9" stroke-width="1.5" marker-end="url(#a)"/><rect x="60" y="520" width="260" height="56" rx="8" fill="#3C3489" stroke="#AFA9EC" stroke-width="0.75"/><text x="190.0" y="539" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#CECBF6">iOS: submit to TestFlight</text><text x="190.0" y="558" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#AFA9EC">Through EAS or App Store Connect</text><rect x="360" y="520" width="260" height="56" rx="8" fill="#3C3489" stroke="#AFA9EC" stroke-width="0.75"/><text x="490.0" y="539" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#CECBF6">Android: upload to Play</text><text x="490.0" y="558" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#AFA9EC">Testing tracks first</text><path d="M190 576 L190 596 L340 596 L340 612" fill="none" stroke="#B4B2A9" stroke-width="1.5" marker-end="url(#a)"/><path d="M490 576 L490 596 L340 596" fill="none" stroke="#B4B2A9" stroke-width="1.5"/><rect x="190" y="616" width="300" height="56" rx="8" fill="#444441" stroke="#B4B2A9" stroke-width="0.75"/><text x="340.0" y="635" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#D3D1C7">Test, then release to users</text><text x="340.0" y="654" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#B4B2A9">App Store and Play review</text><rect x="130" y="694" width="14" height="14" rx="3" fill="#3C3489" stroke="#AFA9EC" stroke-width="0.75"/><text x="152" y="701" dominant-baseline="central" font-size="12" fill="#B4B2A9">Developer</text><rect x="240" y="694" width="14" height="14" rx="3" fill="#085041" stroke="#5DCAA5" stroke-width="0.75"/><text x="262" y="701" dominant-baseline="central" font-size="12" fill="#B4B2A9">GitHub, automatic</text><rect x="410" y="694" width="14" height="14" rx="3" fill="#712B13" stroke="#F0997B" stroke-width="0.75"/><text x="432" y="701" dominant-baseline="central" font-size="12" fill="#B4B2A9">EAS, automatic</text></svg>
