<svg xmlns="http://www.w3.org/2000/svg" width="680" height="728" viewBox="0 0 680 728" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Release: from app.json to the stores</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="190" y="40" width="300" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/><text x="340.0" y="59" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3C3489">Raise the build numbers</text><text x="340.0" y="78" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">In app.json, plus version if public</text><line x1="340" y1="96" x2="340" y2="132" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><rect x="190" y="136" width="300" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/><text x="340.0" y="155" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3C3489">Commit and push</text><text x="340.0" y="174" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Wait for CI to go green</text><line x1="340" y1="192" x2="340" y2="228" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><rect x="190" y="232" width="300" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/><text x="340.0" y="251" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3C3489">Start the release</text><text x="340.0" y="270" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Run workflow, or push a version tag</text><line x1="340" y1="288" x2="340" y2="324" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><rect x="190" y="328" width="300" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/><text x="340.0" y="347" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">Release run on GitHub</text><text x="340.0" y="366" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Checks, CI, queues builds, ~12 min</text><line x1="340" y1="384" x2="340" y2="420" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><rect x="190" y="424" width="300" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75"/><text x="340.0" y="443" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#712B13">EAS builds the apps</text><text x="340.0" y="462" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">iOS and Android, 15 to 30 min</text><path d="M340 480 L340 500 L190 500 L190 516" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><path d="M340 500 L490 500 L490 516" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><rect x="60" y="520" width="260" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/><text x="190.0" y="539" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3C3489">iOS: submit to TestFlight</text><text x="190.0" y="558" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Through EAS or App Store Connect</text><rect x="360" y="520" width="260" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/><text x="490.0" y="539" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3C3489">Android: upload to Play</text><text x="490.0" y="558" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Testing tracks first</text><path d="M190 576 L190 596 L340 596 L340 612" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><path d="M490 576 L490 596 L340 596" fill="none" stroke="#888780" stroke-width="1.5"/><rect x="190" y="616" width="300" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/><text x="340.0" y="635" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#444441">Test, then release to users</text><text x="340.0" y="654" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">App Store and Play review</text><rect x="130" y="694" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/><text x="152" y="701" dominant-baseline="central" font-size="12" fill="#5F5E5A">Developer</text><rect x="240" y="694" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/><text x="262" y="701" dominant-baseline="central" font-size="12" fill="#5F5E5A">GitHub, automatic</text><rect x="410" y="694" width="14" height="14" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75"/><text x="432" y="701" dominant-baseline="central" font-size="12" fill="#5F5E5A">EAS, automatic</text></svg>
