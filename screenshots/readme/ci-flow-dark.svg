<svg xmlns="http://www.w3.org/2000/svg" width="680" height="446" viewBox="0 0 680 446" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Every change: commit, push, CI</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#B4B2A9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="190" y="40" width="300" height="56" rx="8" fill="#3C3489" stroke="#AFA9EC" stroke-width="0.75"/><text x="340.0" y="59" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#CECBF6">Make a change</text><text x="340.0" y="78" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#AFA9EC">Optional: run the tests locally</text><line x1="340" y1="96" x2="340" y2="132" stroke="#B4B2A9" stroke-width="1.5" marker-end="url(#a)"/><rect x="190" y="136" width="300" height="56" rx="8" fill="#3C3489" stroke="#AFA9EC" stroke-width="0.75"/><text x="340.0" y="155" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#CECBF6">Commit and push</text><text x="340.0" y="174" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#AFA9EC">To main, or open a pull request</text><line x1="340" y1="192" x2="340" y2="228" stroke="#B4B2A9" stroke-width="1.5" marker-end="url(#a)"/><rect x="190" y="232" width="300" height="56" rx="8" fill="#085041" stroke="#5DCAA5" stroke-width="0.75"/><text x="340.0" y="251" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#9FE1CB">CI runs on GitHub</text><text x="340.0" y="270" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5DCAA5">4 checks, about 10 minutes</text><path d="M340 288 L340 308 L190 308 L190 324" fill="none" stroke="#B4B2A9" stroke-width="1.5" marker-end="url(#a)"/><path d="M340 308 L490 308 L490 324" fill="none" stroke="#B4B2A9" stroke-width="1.5" marker-end="url(#a)"/><rect x="60" y="328" width="260" height="56" rx="8" fill="#085041" stroke="#5DCAA5" stroke-width="0.75"/><text x="190.0" y="347" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#9FE1CB">All green</text><text x="190.0" y="366" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5DCAA5">Change is safe on main</text><rect x="360" y="328" width="260" height="56" rx="8" fill="#791F1F" stroke="#F09595" stroke-width="0.75"/><text x="490.0" y="347" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#F7C1C1">Something red</text><text x="490.0" y="366" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#F09595">Fix it and push again</text><path d="M600 328 L600 164 L494 164" fill="none" stroke="#B4B2A9" stroke-width="1.5" marker-end="url(#a)"/><rect x="190" y="412" width="14" height="14" rx="3" fill="#3C3489" stroke="#AFA9EC" stroke-width="0.75"/><text x="212" y="419" dominant-baseline="central" font-size="12" fill="#B4B2A9">Developer</text><rect x="310" y="412" width="14" height="14" rx="3" fill="#085041" stroke="#5DCAA5" stroke-width="0.75"/><text x="332" y="419" dominant-baseline="central" font-size="12" fill="#B4B2A9">Automatic on GitHub</text></svg>
